id = "kujjwal02.bifrost"
name = "bifrost"
version = "2.0.0"
min_herdr_version = "0.9.0"
description = "Open your remote machines' ports, links and files in this computer's browser at http://<port>.<machine>.localhost"
platforms = ["macos", "linux"]

# One-shot: starts the background daemon unless one runs, then exits. The
# daemon exits by itself once this herdr server is gone.
[[startup]]
command = ["sh", "bifrost", "start"]

# Brings a crashed daemon back on the next workspace switch, and moves the
# daemon to new code after `herdr plugin update`. A no-op otherwise.
[[events]]
on = "workspace.focused"
command = ["sh", "bifrost", "start"]

[[actions]]
id = "status"
title = "Bifrost: status"
description = "Show each machine's ports and their URLs"
command = ["sh", "bifrost", "show"]

[[actions]]
id = "restart"
title = "Bifrost: restart"
description = "Reconnect every machine and redo its forwards"
command = ["sh", "bifrost", "restart"]

[[actions]]
id = "install-cli"
title = "Bifrost: install the bifrost command"
description = "Put a `bifrost` command in ~/.local/bin"
command = ["sh", "bifrost", "install-cli"]

[[actions]]
id = "open-link"
title = "Bifrost: open a localhost link"
description = "Open a clicked localhost link on the machine herdr shows"
command = ["sh", "bifrost", "open-link"]

# Ctrl+click on http://localhost:5173 in a remote pane opens that machine's
# server, not whatever listens on this computer's port 5173.
[[link_handlers]]
id = "localhost"
title = "Open on the remote machine"
pattern = "^http://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\])(:[0-9]+)?(/.*)?$"
action = "open-link"

[[panes]]
id = "status"
title = "Bifrost"
placement = "popup"
width = "70%"
height = 16
command = ["sh", "bifrost", "status", "--wait"]

# Asks before a remote opens a page that is not its own.
[[panes]]
id = "confirm"
title = "Bifrost: open this page?"
placement = "popup"
width = "70%"
height = 12
command = ["sh", "bifrost", "confirm"]
