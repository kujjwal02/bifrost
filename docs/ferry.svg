<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img"><title>What ferry does: remote ports, links, files and Ctrl+clicked links open in this computer&#x27;s browser</title><rect width="960" height="528" rx="16" fill="#1e1e2e"/><text x="215.0" y="32" fill="#6c7086" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">on the remote machine</text><text x="735.0" y="32" fill="#6c7086" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">on your computer</text><g transform="translate(20 52)"><rect width="390" height="100" rx="10" fill="#181825" stroke="#313244"/><text x="16" y="22" fill="#6c7086" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">afk</text><text x="16" y="50" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> npm run dev</text><text x="16" y="72" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">  ➜ Local: <tspan fill="#89b4fa">http://localhost:5173/</tspan></text><path d="M404 50.0 H488" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M488 44.0 L498 50.0 L488 56.0 Z" fill="#cba6f7"/><text x="446.0" y="38.0" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" xml:space="preserve">port</text><text x="446.0" y="72.0" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="middle" xml:space="preserve">routed</text><g transform="translate(510 0)"><rect width="410" height="100" rx="10" fill="#eff1f5" stroke="#313244"/><path d="M0 10a10 10 0 0 1 10-10h390a10 10 0 0 1 10 10v20H0z" fill="#dce0e8"/><rect x="12" y="6" width="386" height="18" rx="9" fill="#fff"/><text x="24" y="19" fill="#4c4f69" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">5173.afk.localhost</text><text x="16" y="50" fill="#4c4f69" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">Your Vite app, served from afk</text><text x="16" y="70" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">Hot reload works. No port clashes with this</text><text x="16" y="90" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">computer or another machine's 5173.</text></g></g><g transform="translate(20 170)"><rect width="390" height="100" rx="10" fill="#181825" stroke="#313244"/><text x="16" y="22" fill="#6c7086" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">afk</text><text x="16" y="50" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> gh auth login --web</text><text x="16" y="72" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">  Open <tspan fill="#89b4fa">github.com/login/device</tspan></text><path d="M404 50.0 H488" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M488 44.0 L498 50.0 L488 56.0 Z" fill="#cba6f7"/><text x="446.0" y="38.0" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" xml:space="preserve">link</text><text x="446.0" y="72.0" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="middle" xml:space="preserve">asks first</text><g transform="translate(510 0)"><rect width="410" height="100" rx="10" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.5"/><rect x="1" y="1" width="408" height="26" rx="9" fill="#313244"/><text x="14" y="19" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="start" xml:space="preserve">Ferry: open this page?</text><text x="14" y="50" fill="#cdd6f4" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">afk wants to open  <tspan fill="#89b4fa">github.com/login/device</tspan></text><text x="14" y="72" fill="#cdd6f4" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">Enter</tspan> open   <tspan fill="#f9e2af">n</tspan> skip   <tspan fill="#fab387">q</tspan> skip all</text></g></g><g transform="translate(20 288)"><rect width="390" height="100" rx="10" fill="#181825" stroke="#313244"/><text x="16" y="22" fill="#6c7086" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">afk</text><text x="16" y="50" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> xdg-open report.html</text><text x="16" y="72" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#6c7086">  agent wrote ~/proj/report.html</tspan></text><path d="M404 50.0 H488" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M488 44.0 L498 50.0 L488 56.0 Z" fill="#cba6f7"/><text x="446.0" y="38.0" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" xml:space="preserve">file</text><text x="446.0" y="72.0" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="middle" xml:space="preserve">opens here</text><g transform="translate(510 0)"><rect width="410" height="100" rx="10" fill="#eff1f5" stroke="#313244"/><path d="M0 10a10 10 0 0 1 10-10h390a10 10 0 0 1 10 10v20H0z" fill="#dce0e8"/><rect x="12" y="6" width="386" height="18" rx="9" fill="#fff"/><text x="24" y="19" fill="#4c4f69" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">files.afk.localhost/…/report.html</text><text x="16" y="50" fill="#4c4f69" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">Benchmark report</text><text x="16" y="70" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">The file from afk, with its</text><text x="16" y="90" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">CSS, images and charts</text><rect x="250" y="70" width="16" height="18" rx="2" fill="#1e66f5" opacity="0.45"/><rect x="276" y="58" width="16" height="30" rx="2" fill="#1e66f5" opacity="0.55"/><rect x="302" y="64" width="16" height="24" rx="2" fill="#1e66f5" opacity="0.65"/><rect x="328" y="44" width="16" height="44" rx="2" fill="#1e66f5" opacity="0.75"/><rect x="354" y="50" width="16" height="38" rx="2" fill="#1e66f5" opacity="0.8500000000000001"/><rect x="380" y="36" width="16" height="52" rx="2" fill="#1e66f5" opacity="0.95"/></g></g><g transform="translate(20 406)"><rect width="390" height="100" rx="10" fill="#181825" stroke="#313244"/><text x="16" y="22" fill="#6c7086" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">herdr pane on afk</text><text x="16" y="50" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> npm run dev</text><text x="16" y="72" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">  ➜ Local: <tspan fill="#89b4fa" text-decoration="underline">http://localhost:5173/</tspan></text><g transform="translate(300 64)"><path d="M0 0 L0 17 L4.5 13 L8 20 L11 18.5 L7.5 12 L13 12 Z" fill="#fff" stroke="#1e1e2e" stroke-width="1.2"/></g><path d="M404 50.0 H488" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M488 44.0 L498 50.0 L488 56.0 Z" fill="#cba6f7"/><text x="446.0" y="38.0" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" xml:space="preserve">Ctrl+click</text><text x="446.0" y="72.0" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="middle" xml:space="preserve">opens afk's</text><g transform="translate(510 0)"><rect width="410" height="100" rx="10" fill="#eff1f5" stroke="#313244"/><path d="M0 10a10 10 0 0 1 10-10h390a10 10 0 0 1 10 10v20H0z" fill="#dce0e8"/><rect x="12" y="6" width="386" height="18" rx="9" fill="#fff"/><text x="24" y="19" fill="#4c4f69" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">5173.afk.localhost</text><text x="16" y="50" fill="#4c4f69" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">afk's server on port 5173</text><text x="16" y="70" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">not whatever this computer</text><text x="16" y="90" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">runs on its own port 5173</text></g></g></svg>
