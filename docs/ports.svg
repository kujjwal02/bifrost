<svg xmlns="http://www.w3.org/2000/svg" width="960" height="140" viewBox="0 0 960 140" role="img"><title>bifrost: ports</title><rect width="960" height="140" rx="16" fill="#1e1e2e"/><g transform="translate(20 20)"><rect width="390" height="100" rx="10" fill="#181825" stroke="#313244"/><text x="16" y="22" fill="#6c7086" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">afk</text><text x="16" y="50" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve"><tspan fill="#a6e3a1">$</tspan> npm run dev</text><text x="16" y="72" fill="#cdd6f4" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">  ➜ Local: <tspan fill="#89b4fa">http://localhost:5173/</tspan></text><path d="M404 50.0 H488" stroke="#cba6f7" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M488 44.0 L498 50.0 L488 56.0 Z" fill="#cba6f7"/><text x="446.0" y="38.0" fill="#cba6f7" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" text-anchor="middle" xml:space="preserve">port</text><text x="446.0" y="72.0" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="middle" xml:space="preserve">routed</text><g transform="translate(510 0)"><rect width="410" height="100" rx="10" fill="#eff1f5" stroke="#313244"/><path d="M0 10a10 10 0 0 1 10-10h390a10 10 0 0 1 10 10v20H0z" fill="#dce0e8"/><rect x="12" y="6" width="386" height="18" rx="9" fill="#fff"/><text x="24" y="19" fill="#4c4f69" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start" xml:space="preserve">5173.afk.localhost</text><text x="16" y="50" fill="#4c4f69" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">Your Vite app, served from afk</text><text x="16" y="70" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">Hot reload works. No port clashes with this</text><text x="16" y="90" fill="#6c6f85" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="400" text-anchor="start" xml:space="preserve">computer or another machine's 5173.</text></g></g></svg>
