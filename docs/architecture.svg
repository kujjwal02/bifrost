 4"/><text x="772" y="62" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" text-anchor="middle" xml:space="preserve">remote machine (afk)</text><text x="100" y="30" fill="#6c7086" font-size="12" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">your computer</text><rect x="424" y="78" width="180" height="244" rx="22" fill="#181825" stroke="#313244"/><text x="514" y="344" fill="#6c7086" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">one SSH master per machine</text><path d="M405 110 L620 110" stroke="#89b4fa" stroke-width="2" marker-end="url(#head-89b4fa)"/><text x="514" y="101" fill="#89b4fa" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">port forwards</text><path d="M405 200 L620 200" stroke="#a6e3a1" stroke-width="2" marker-end="url(#head-a6e3a1)"/><text x="514" y="191" fill="#a6e3a1" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">file reads</text><path d="M405 290 L620 290" stroke="#cba6f7" stroke-width="2" marker-end="url(#head-cba6f7)" marker-start="url(#tail-cba6f7)"/><text x="514" y="281" fill="#cba6f7" font-size="11" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">ticks ⇄ ports, opens</text><rect x="30" y="78" width="140" height="154" rx="8" fill="#eff1f5" stroke="#313244"/><text x="100" y="100" fill="#4c4f69" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">Browser</text><text x="100" y="114" fill="#1e66f5" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anc