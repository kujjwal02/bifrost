eserve">HMAC check, stream</text><rect x="215" y="265" width="190" height="50" rx="8" fill="#181825" stroke="#cba6f7"/><text x="310.0" y="287.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">machine thread</text><text x="310.0" y="304.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">forwards, open rules</text><rect x="622" y="85" width="300" height="50" rx="8" fill="#181825" stroke="#89b4fa"/><text x="772.0" y="107.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">dev server :5173</text><text x="772.0" y="124.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">any listener of your user, port ≥ 1024</text><rect x="622" y="175" width="300" height="50" rx="8" fill="#181825" stroke="#a6e3a1"/><text x="772.0" y="197.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">sh: realpath -e, cat</text><text x="772.0" y="214.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">refuses files outside the folder</text><rect x="622" y="265" width="300" height="50" rx="8" fill="#181825" stroke="#cba6f7"/><text x="772.0" y="287.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">watch.sh</text><text x="772.0" y="304.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">reads /proc/net/tcp every tick</text><rect x="622" y="362" width="70" height="50" rx="8" fill="#181825" stroke="#313244"/><text x="657.0" y="384.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">agent</text><text x="657.0" y="401.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">xdg-open</text><rect x="710" y="362" width="96" height="50" rx="8" fill="#181825" stroke="#313244"/><text x="758.0" y="384.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">opener</text><text x="758.0" y="401.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">as xdg-open</text><rect x="824" y="362" width="98" height="50" rx="8" fill="#181825" stroke="#313244"/><text x="873.0" y="384.0" fill="#cdd6f4" font-size="13" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" text-anchor="middle" xml:space="preserve">queue</text><text x="873.0" y="401.0" fill="#6c7086" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="middle" xml:space="preserve">~/.cache/ferry</text><path d="M692 387 L708 387" stroke="#6c7086" stroke-width="2" marker-end="url(#head-6c7086)"/><path d="M806 387 L822 387" stroke="#6c7086" stroke-width="2" marker-end="url(#head-6c7086)"/><path d="M873 362 L873 317" stroke="#6c7086" stroke-width="2" marker-end="url(#head-6c7086)"/></svg>
